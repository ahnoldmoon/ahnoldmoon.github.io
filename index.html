<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ahnoldmoon — 브라우저 확장 프로그램</title>
<meta name="description" content="일하다 불편했던 것을 직접 만들어 씁니다. 만든 도구를 정리해 둔 페이지입니다." />
<style>
  :root { --bg:#f7f8f4; --card:#fff; --ink:#1a2b1e; --muted:#5a6b5e; --line:#dde3d8; --accent:#2e6b3f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:"Malgun Gothic","Segoe UI",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
    padding:72px 20px 90px; -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:30px; font-weight:800; letter-spacing:-0.035em; }
  .lead { font-size:16px; color:var(--muted); margin-top:12px; }
  h2 { font-size:15px; font-weight:800; letter-spacing:-0.02em; color:var(--muted);
       margin:52px 0 14px; text-transform:uppercase; }
  .card {
    display:flex; gap:18px; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; text-decoration:none; color:inherit;
    transition:border-color .15s;
  }
  .card:hover { border-color:var(--accent); }
  .card img { width:52px; height:52px; border-radius:12px; flex-shrink:0; }
  .card h3 { font-size:17px; font-weight:800; letter-spacing:-0.025em; }
  .card p { font-size:14.5px; color:var(--muted); margin-top:5px; }
  .tags { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .tags span {
    font-size:11.5px; font-weight:700; color:var(--accent);
    background:#eaf1e9; border-radius:20px; padding:3px 10px;
  }
  footer { margin-top:60px; padding-top:22px; border-top:1px solid var(--line);
           font-size:13.5px; color:var(--muted); }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <h1>ahnoldmoon</h1>
  <p class="lead">
    일하다 불편했던 것을 직접 만들어 씁니다.<br />
    만든 브라우저 확장 프로그램을 여기에 정리해 둡니다.
  </p>

  <h2>만든 것</h2>

  <a class="card" href="table2xlsx/">
    <img src="table2xlsx/img/icon128.png" alt="" />
    <div>
      <h3>표를 엑셀로 저장 (Table to Excel)</h3>
      <p>웹페이지의 표를 클릭 한 번으로 .xlsx 파일로 내려받는 Chrome 확장 프로그램.
         표 데이터는 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>
      <div class="tags"><span>Chrome 확장</span><span>서버 전송 없음</span><span>병합 셀 지원</span></div>
    </div>
  </a>

  <footer>
    문의: <a href="mailto:pygichacha@gmail.com">pygichacha@gmail.com</a><br />
    © 2026 ahnoldmoon
  </footer>

</div>
</body>
</html>
